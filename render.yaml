services:
  - type: web
    name: carebridge
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carebridge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/carebridge-uploads
      - key: NODE_ENV
        value: production
    disk:
      name: carebridge-certificates
      mountPath: /var/data/carebridge-uploads
      sizeGB: 1

databases:
  - name: carebridge-db
    databaseName: carebridge
    user: carebridge
    plan: free
