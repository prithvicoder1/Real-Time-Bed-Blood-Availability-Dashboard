services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://carebridge:carebridge@postgres:5432/carebridge
      - JWT_SECRET=local-development-only-change-me
    depends_on:
      - postgres
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001
      - VITE_PROXY_TARGET=http://backend:5001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=carebridge
      - POSTGRES_PASSWORD=carebridge
      - POSTGRES_DB=carebridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  postgres-data:
